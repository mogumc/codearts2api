services:
  codearts2api:
    build: .
    # 也可以直接用已发布的镜像：
    # image: ghcr.io/moguqaq/codearts2api:latest
    container_name: codearts2api
    restart: unless-stopped
    ports:
      # 只映射到宿主机回环地址，避免容器端口直接暴露到公网。
      # 需要局域网/公网访问时改为 "8787:8787"，并务必设置 CODEARTS_API_KEYS。
      - "127.0.0.1:8787:8787"
    environment:
      # 建议改用 .env 文件或 secrets 管理，不要把真实 AK/SK 写进版本库。
      CODEARTS_AK: "${CODEARTS_AK}"
      CODEARTS_SK: "${CODEARTS_SK}"
      # 下游鉴权：镜像默认监听 0.0.0.0，务必设置密钥，否则同网络内任何人都能白用。
      CODEARTS_API_KEYS: "${CODEARTS_API_KEYS:-}"
      CODEARTS_AUTO_CLAIM: "1"
      TZ: "Asia/Shanghai"
      # 通过中转访问时才需要，直连官方地址留空即可。
      # CODEARTS_BASE_URL: "https://relay.example.com/codearts"
      # CODEARTS_BASE_HOST: "snap-access.cn-north-4.myhuaweicloud.com"
      # CODEARTS_OPENGW_BASE_URL: "https://relay.example.com/opengw"
      # CODEARTS_OPENGW_BASE_HOST: "opengw.developer.huaweicloud.com"
    volumes:
      # 持久化模型缓存与签到状态，容器重建后不丢失。
      - codearts2api-data:/data

volumes:
  codearts2api-data:
